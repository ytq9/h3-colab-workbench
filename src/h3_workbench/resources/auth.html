<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H3 · 连接 Google</title>
<style>
body{max-width:640px;margin:8vh auto;padding:24px;font:17px/1.8 system-ui;background:#f5f7fb;color:#172238}
button,a{font:inherit}button{border:0;border-radius:9px;padding:10px 20px;background:#2457df;color:white;cursor:pointer}
input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #a9b7cb;border-radius:8px;font:inherit}
.card{background:white;padding:24px;border-radius:16px;box-shadow:0 8px 30px #1722380b}a{color:#2457df}
[hidden]{display:none!important}#message{color:#37506f}small{color:#52637b}
</style>
<main class="card">
<h1>连接你的 Colab 账号</h1>
<p>只需首次连接。之后在本机 ComfyUI 编辑，点击“运行”时才申请 GPU。</p>
<p>请使用 <b id="account">配置的 Google 账号</b>。Google 将授权本机程序识别账号和管理 Colab 会话；
连接凭据仅保存在这台 Mac，不同步到 Drive。此步骤不会启动 GPU或购买额度。</p>
<button id="start">连接 Google</button>
<p id="message">准备连接。</p>
<p id="link-wrap" hidden><a id="authorize" target="_blank" rel="noopener noreferrer">打开 Google 授权页 ↗</a></p>
<form id="code-form" hidden>
<label for="code">Google 页面显示的授权码</label>
<input id="code" type="password" autocomplete="off" spellcheck="false">
<p><button type="submit">完成连接</button></p>
<small>授权码只填在这里，不需要发到聊天中。</small>
</form>
<p><a href="/">返回 ComfyUI</a></p>
</main>
<script>
const message=document.querySelector("#message"),start=document.querySelector("#start"),form=document.querySelector("#code-form");
let submitted=false;
async function refresh(){
  try{
    const s=await (await fetch("/h3/status",{cache:"no-store"})).json();
    message.textContent=s.auth_message;
    document.querySelector("#account").textContent=s.expected_account;
    start.textContent=s.authorized?"重新连接 Google":"连接 Google";
    document.querySelector("#link-wrap").hidden=!s.auth_url;
    form.hidden=!s.auth_url||s.authorized||submitted;
    if(s.auth_url)document.querySelector("#authorize").href=s.auth_url;
    if(s.authorized){form.hidden=true;document.querySelector("#link-wrap").hidden=true;}
  }catch{message.textContent="本机工作台暂时未连接，请重新启动本机工作台。";}
}
start.onclick=async()=>{
  start.disabled=true;submitted=false;
  try{const r=await fetch("/h3/auth/start",{method:"POST"});const d=await r.json();if(!r.ok)message.textContent=d.error;else await refresh();}
  finally{start.disabled=false;}
};
form.onsubmit=async event=>{
  event.preventDefault();
  const input=document.querySelector("#code");
  const r=await fetch("/h3/auth/code",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:input.value})});
  input.value="";const d=await r.json();
  if(r.ok){submitted=true;form.hidden=true;await refresh();}else message.textContent=d.error;
};
refresh();setInterval(refresh,2000);
</script>
</html>
