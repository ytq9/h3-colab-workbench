[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-colab-workbench"
version = "0.1.1"
description = "Local CPU ComfyUI editing with on-demand Colab GPU video generation"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/*.LICENSE"]
authors = [{name = "ytq9"}]
dependencies = []

[project.optional-dependencies]
colab = ["google-colab-cli==0.7.4"]

[project.scripts]
h3-workbench = "h3_workbench.cli:main"

[project.urls]
Repository = "https://github.com/ytq9/h3-colab-workbench"
Issues = "https://github.com/ytq9/h3-colab-workbench/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
h3_workbench = ["resources/*.json", "resources/*.txt", "resources/*.html", "resources/*.py", "resources/web/*.js", "resources/workflows/*.json"]
