name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and pinned CLI for offline transport tests
        run: python -m pip install '.[colab]'
      - name: Local regression tests (no Colab, credentials or GPU)
        run: python -m unittest discover -s tests -v
      - name: Check release contents
        run: python scripts/check_release.py
      - name: Build wheel
        run: python -m pip wheel --no-deps . -w dist
